<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">

  <!-- PWA – iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FemboyPhone">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- PWA – standard -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f0f18">

  <title>FemboyPhone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Phone shell -->
    <div class="phone">
      <div class="dynamic-island">
        <div class="dynamic-island__pill"></div>
      </div>
      <!-- All screen content goes here -->
      <div class="screen" id="phone-screen"></div>
      <div class="home-bar">
        <div class="home-bar__line"></div>
      </div>
    </div>
  </div>

  <script src="story.js"></script>
  <script src="game.js"></script>
  <script src="views.js"></script>
  <script src="app.js"></script>
</body>
</html>
